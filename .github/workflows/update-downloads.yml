name: Update Download Count
on:
  schedule:
    - cron: "23 * * * *"
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update-downloads:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Calculate downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fetch_page() {
            local page=$1
            local attempt=1
            while [ $attempt -le 3 ]; do
              if result=$(gh api "/repos/${GITHUB_REPOSITORY}/releases?per_page=100&page=${page}" 2>/tmp/err.log); then
                echo "$result"
                return 0
              fi
              echo "gh api failed (attempt $attempt): $(cat /tmp/err.log)" >&2
              attempt=$((attempt + 1))
              sleep $((attempt * 5))
            done
            return 1
          }

          total=0
          page=1
          while true; do
            releases=$(fetch_page "$page") || { echo "Giving up after retries on page $page"; exit 1; }
            count=$(echo "$releases" | jq 'length')
            if [ "$count" -eq 0 ]; then
              break
            fi
            page_total=$(echo "$releases" | jq '[.[].assets[].download_count] | add // 0')
            total=$((total + page_total))
            if [ "$count" -lt 100 ]; then
              break
            fi
            page=$((page + 1))
          done
          echo "Total downloads: $total"
          echo "$total" > downloads.txt

      - name: Format number
        id: format
        run: |
          total=$(cat downloads.txt | tr -d '[:space:]')

          if ! [[ "$total" =~ ^[0-9]+$ ]]; then
            echo "ERROR: total is not a valid number: '$total'"
            exit 1
          fi

          if [ "$total" -ge 1000000 ]; then
            formatted=$(awk -v n="$total" 'BEGIN{printf "%.1fM", n/1000000}')
          elif [ "$total" -ge 1000 ]; then
            formatted=$(awk -v n="$total" 'BEGIN{printf "%.1fk", n/1000}')
          else
            formatted="$total"
          fi

          echo "Formatted: $formatted"
          echo "formatted=$formatted" >> "$GITHUB_OUTPUT"

      - name: Update Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: 95cfc6f0535930f25591dcfe08f34cc1
          FORMATTED: ${{ steps.format.outputs.formatted }}
        run: |
          payload=$(jq -n \
            --arg content "{\"schemaVersion\":1,\"label\":\"downloads\",\"message\":\"${FORMATTED}\",\"color\":\"blue\"}" \
            '{files: {"downloads.json": {content: $content}}}')

          curl -s -X PATCH \
            -H "Authorization: token ${GIST_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/gists/${GIST_ID}" \
            -d "$payload"
