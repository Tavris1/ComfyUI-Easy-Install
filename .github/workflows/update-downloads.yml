name: Update Download Count
on:
  schedule:
    - cron: "23 * * * *"
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-downloads-badge
  cancel-in-progress: false
jobs:
  update-downloads:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: data
          fetch-depth: 0

      - name: Calculate downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fetch_page() {
            local page=$1
            local attempt=1
            while [ $attempt -le 3 ]; do
              if result=$(gh api "/repos/${GITHUB_REPOSITORY}/releases?per_page=100&page=${page}" 2>/tmp/err.log); then
                echo "$result"
                return 0
              fi
              echo "gh api failed (attempt $attempt): $(cat /tmp/err.log)" >&2
              attempt=$((attempt + 1))
              sleep $((attempt * 5))
            done
            return 1
          }

          total=0
          page=1
          while true; do
            releases=$(fetch_page "$page") || { echo "Giving up after retries on page $page"; exit 1; }
            count=$(echo "$releases" | jq 'length')
            if [ "$count" -eq 0 ]; then
              break
            fi
            page_total=$(echo "$releases" | jq '[.[].assets[].download_count] | add // 0')
            total=$((total + page_total))
            if [ "$count" -lt 100 ]; then
              break
            fi
            page=$((page + 1))
          done
          echo "Total downloads: $total"
          echo "$total" > downloads.txt

      - name: Update badge data
        run: |
          total=$(cat downloads.txt | tr -d '[:space:]')
          mkdir -p .github/badges

          if ! [[ "$total" =~ ^[0-9]+$ ]]; then
            echo "ERROR: total is not a valid number: '$total'"
            exit 1
          fi

          if [ "$total" -ge 1000000 ]; then
            formatted=$(awk -v n="$total" 'BEGIN{printf "%.1fM", n/1000000}')
          elif [ "$total" -ge 1000 ]; then
            formatted=$(awk -v n="$total" 'BEGIN{printf "%.1fk", n/1000}')
          else
            formatted="$total"
          fi

          echo "Formatted: $formatted"

          cat > .github/badges/downloads.json <<EOF
          {"schemaVersion":1,"label":"downloads","message":"${formatted}","color":"blue"}
          EOF

      - name: Commit badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/downloads.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Update download count badge"

          for i in 1 2 3 4 5; do
            if git push origin HEAD:data; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push rejected, attempt $i. Fetching and rebasing..."
            git fetch origin data
            git rebase origin/data || {
              echo "Rebase conflict, aborting."
              git rebase --abort || true
              exit 1
            }
            sleep $((RANDOM % 5 + 2))
          done

          echo "Push failed after retries."
          exit 1
