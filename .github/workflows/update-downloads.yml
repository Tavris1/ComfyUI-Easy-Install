name: Update Download Count
on:
  schedule:
    - cron: "7,37 * * * *"
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-downloads-badge
  cancel-in-progress: false
jobs:
  update-downloads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Calculate downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          total=0
          page=1
          while true; do
            releases=$(gh api \
              "/repos/${GITHUB_REPOSITORY}/releases?per_page=100&page=${page}")
            count=$(echo "$releases" | jq 'length')
            if [ "$count" -eq 0 ]; then
              break
            fi
            page_total=$(echo "$releases" | jq '[.[].assets[].download_count] | add // 0')
            total=$((total + page_total))
            if [ "$count" -lt 100 ]; then
              break
            fi
            page=$((page + 1))
          done
          echo "Total downloads: $total"
          echo "$total" > downloads.txt

      - name: Update badge data
        run: |
          total=$(cat downloads.txt | tr -d '[:space:]')
          mkdir -p .github/badges

          if ! [[ "$total" =~ ^[0-9]+$ ]]; then
            echo "ERROR: total is not a valid number: '$total'"
            exit 1
          fi

          if [ "$total" -ge 1000000 ]; then
            formatted=$(awk -v n="$total" 'BEGIN{printf "%.1fM", n/1000000}')
          elif [ "$total" -ge 1000 ]; then
            formatted=$(awk -v n="$total" 'BEGIN{printf "%.1fk", n/1000}')
          else
            formatted="$total"
          fi

          echo "Formatted: $formatted"

          cat > .github/badges/downloads.json <<EOF
          {"schemaVersion":1,"label":"downloads","message":"${formatted}","color":"blue"}
          EOF

      - name: Commit badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/downloads.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update download count badge"
            git pull --rebase origin Windows
            git push
          fi
